name: Stock Radar (每日股票信息)

on:
  schedule:
    # 07:30 America/New_York（盘前）。GitHub 的 cron 只认 UTC，
    # 夏令时 11:30 UTC / 冬令时 12:30 UTC，所以两条都排，脚本自身按天去重。
    - cron: "30 11 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "回补指定日期 (YYYY-MM-DD)，留空跑今天"
        required: false
      only:
        description: "只跑部分采集器: congress,insiders,funds,news"
        required: false

concurrency:
  group: stock-radar
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: stock-radar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock-radar/requirements.txt

      - run: pip install -r requirements.txt

      # 跨天去重的 sqlite 状态库。key 带 run_id 保证每次都能写新缓存，
      # restore-keys 让下一次拿到最近一份。
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            stock-radar/.stock-radar
            stock-radar/out
          key: stock-radar-state-${{ github.run_id }}
          restore-keys: stock-radar-state-

      # config.yaml is the user's own committed config; fall back to the example so a
      # fresh clone still produces a report instead of crashing on a missing file.
      - name: Pick config
        id: cfg
        run: |
          if [[ -f config.yaml ]]; then
            echo "path=config.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::没有 config.yaml，本次用 config.example.yaml 的默认关注列表。" \
                 "提交一份自己的 config.yaml 才会按你的 watchlist 跑。"
            echo "path=config.example.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Run digest
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_RADAR_WEBHOOK: ${{ secrets.STOCK_RADAR_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -m stock_radar run \
            --config "${{ steps.cfg.outputs.path }}" \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: Job summary
        if: always()
        run: cat out/latest.md >> "$GITHUB_STEP_SUMMARY" || echo "本次没有生成报告" >> "$GITHUB_STEP_SUMMARY"

      # Today's report becomes the site's front page; the dated copies become an archive.
      - name: Build site
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import re

          out = pathlib.Path("out")
          latest = out / "latest.html"
          if not latest.exists():
              raise SystemExit("没有 latest.html，跳过建站")

          dated = sorted(
              (p for p in out.glob("*.html") if re.fullmatch(r"\d{4}-\d{2}-\d{2}", p.stem)),
              key=lambda p: p.stem,
              reverse=True,
          )
          nav = (
              '<div style="max-width:760px;margin:18px auto 0;padding:0 30px 40px;'
              'font:13px -apple-system,BlinkMacSystemFont,\'Segoe UI\',\'PingFang SC\',sans-serif;'
              'color:#6b7280;text-align:center;">'
              f'<a href="archive.html" style="color:#2563eb;">查看往期报告（{len(dated)} 期）</a>'
              "</div>"
          )
          body = latest.read_text(encoding="utf-8")
          (out / "index.html").write_text(body.replace("</body>", nav + "</body>"), encoding="utf-8")

          rows = "".join(
              f'<li><a href="{p.name}">{p.stem}</a></li>' for p in dated
          ) or "<li>还没有历史报告</li>"
          (out / "archive.html").write_text(
              "<!doctype html><html lang=\"zh\"><head><meta charset=\"utf-8\">"
              '<meta name="viewport" content="width=device-width,initial-scale=1">'
              "<title>往期报告 · 每日股票雷达</title></head>"
              '<body style="margin:0;padding:40px 20px;background:#f5f6f8;color:#16181d;'
              "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;\">"
              '<div style="max-width:640px;margin:0 auto;background:#fff;border:1px solid #e4e6eb;'
              'border-radius:14px;padding:28px 30px;">'
              '<h1 style="margin:0 0 4px;font-size:20px;">往期报告</h1>'
              f'<p style="margin:0 0 20px;color:#6b7280;font-size:13px;">共 {len(dated)} 期 · '
              '<a href="index.html" style="color:#2563eb;">回到最新一期</a></p>'
              f'<ul style="margin:0;padding-left:20px;line-height:2;font-variant-numeric:tabular-nums;">{rows}</ul>'
              "</div></body></html>",
              encoding="utf-8",
          )
          print(f"建站完成：index.html + archive.html（{len(dated)} 期归档）")
          PY

      # 报告推到一个孤儿分支上，GitHub 会把 Markdown 直接渲染出来——
      # 不需要开 Pages、不需要下载 artifact，手机浏览器打开就能看。
      # 用孤儿分支是为了不把每天的提交混进代码历史。
      # 报告推到一个孤儿分支上，GitHub 会把 Markdown 直接渲染出来——
      # 不需要开 Pages、不需要下载 artifact，手机浏览器打开就能看。
      # 分支每次整棵重建（历史只留一版），文件本身照常累积。
      - name: Publish report to the reports branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -f out/latest.md ]] || { echo "没有报告可发布，跳过"; exit 0; }
          cd "$GITHUB_WORKSPACE"

          staging=$(mktemp -d)
          # 取回分支已有内容；第一次跑时分支还不存在，staging 就是空的
          if git fetch --depth=1 origin reports 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C "$staging"
          fi
          cp stock-radar/out/*.md "$staging"/

          {
            echo "# 每日股票雷达 · 报告存档"
            echo
            echo "最新一期 → **[latest.md](latest.md)**"
            echo
            echo "更新于 $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "## 往期"
            echo
            ls -1 "$staging" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort -r \
              | sed -E 's/^(.*)\.md$/- [\1](\1.md)/' || echo "_（还没有往期）_"
          } > "$staging/README.md"

          cd "$staging"
          git init -q -b reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "报告 $(date -u '+%Y-%m-%d')"
          git push -f -q origin reports
          echo "已发布 → https://github.com/${GITHUB_REPOSITORY}/blob/reports/latest.md"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-radar-${{ github.run_id }}
          path: stock-radar/out/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload site
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: stock-radar/out

  # 把报告挂到一个固定网址上。需要先在仓库 Settings → Pages 把 Source 选成 "GitHub Actions"；
  # 没开的话这个 job 会失败但不影响上面的报告生成，所以整体不会变红。
  publish:
    needs: digest
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
