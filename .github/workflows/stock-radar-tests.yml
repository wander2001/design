name: Stock Radar tests

on:
  push:
    paths: ["stock-radar/**", ".github/workflows/stock-radar*.yml"]
  pull_request:
    paths: ["stock-radar/**", ".github/workflows/stock-radar*.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-radar
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: stock-radar/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
