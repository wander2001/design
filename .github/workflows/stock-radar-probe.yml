name: Stock Radar probe (数据源体检)

# Runs the live diagnostics against the real SEC / disclosure / RSS endpoints.
# GitHub's runners can reach them, which makes this the place to verify that our
# format assumptions still hold. Each stage is its own job so one stage's output
# is not buried in another's log.
on:
  push:
    paths:
      - "stock-radar/stock_radar/**"
      - ".github/workflows/stock-radar-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # 每周一体检一次，格式漂移能早发现

env:
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('stock-radar probe (+https://github.com/{0})', github.repository) }}

jobs:
  sec-access:
    name: SEC 准入矩阵
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stock-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -c "from stock_radar.diagnose import sec_403_detail, sec_access_matrix; sec_access_matrix(); sec_403_detail()"

  congress-sources:
    name: 国会数据源存活与结构
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stock-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -c "from stock_radar.diagnose import congress_mirror_check, house_clerk_pdf_check; congress_mirror_check(); house_clerk_pdf_check()"

  house-pdf:
    name: 众议院 PTR PDF 正文
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stock-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -c "from stock_radar.diagnose import house_ptr_pdf_text; house_ptr_pdf_text()"

  senate:
    name: 参议院 EFD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stock-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -c "from stock_radar.diagnose import senate_efd_check, senate_report_shape; senate_efd_check(); senate_report_shape()"

  probe:
    name: 数据源体检 + 端到端
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: stock-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock-radar/requirements.txt
      - run: pip install -r requirements.txt

      - name: Build probe config
        run: |
          python - <<'PY'
          import pathlib

          import yaml

          d = yaml.safe_load(open("config.example.yaml"))
          d["sec"]["user_agent"] = ""          # use SEC_USER_AGENT from the environment
          d["state"]["path"] = "/tmp/probe-state.db"
          d["output"]["dir"] = "probe-out"
          pathlib.Path("probe-config.yaml").write_text(yaml.safe_dump(d, allow_unicode=True))
          PY

      - name: Probe every data source
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          python -m stock_radar probe -c probe-config.yaml 2>&1 | tee probe.log

      - name: End-to-end run against live data
        continue-on-error: true
        run: |
          set -o pipefail
          python -m stock_radar -v run -c probe-config.yaml --no-notify 2>&1 | tail -40 | tee run.log
          echo "================ 真实数据生成的报告 ================"
          cat probe-out/latest.md

      # Printed last so the sections that matter sit at the tail of the job log.
      - name: 国会板块与数据源状态
        if: always()
        run: |
          echo "########## 国会议员交易 ##########"
          sed -n '/国会议员交易/,/公司高管买卖/p' probe-out/latest.md | head -60 || true
          echo "########## 数据源状态 ##########"
          sed -n '/数据源状态/,$p' probe-out/latest.md || true

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            stock-radar/probe.log
            stock-radar/run.log
            stock-radar/probe-out/
          retention-days: 14
          if-no-files-found: warn
