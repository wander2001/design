<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe6">
  <title>番茄伙伴 · 把你的照片变成会动的专注搭子</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">🍅</span> 番茄伙伴</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" title="切换主题">🌗</button>
        <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
      </div>
    </header>

    <main class="main">
      <div class="stage" id="stage">
        <svg class="ring" viewBox="0 0 320 320" aria-hidden="true">
          <circle class="ring-track" cx="160" cy="160" r="148"/>
          <circle class="ring-progress" id="ringProgress" cx="160" cy="160" r="148"/>
        </svg>
        <div class="char-host" id="charHost"></div>
      </div>

      <div class="readout">
        <div class="time" id="timeText">25:00</div>
        <div class="phase-line">
          <span id="phaseText">准备专注</span>
          <span class="dots" id="roundDots"></span>
        </div>
      </div>

      <div class="phase-tabs" id="phaseTabs">
        <button class="tab on" data-phase="focus">专注</button>
        <button class="tab" data-phase="short">小憩</button>
        <button class="tab" data-phase="long">长休</button>
      </div>

      <div class="controls">
        <button class="btn ghost" id="resetBtn" title="重置 (R)">重置</button>
        <button class="btn primary big" id="startBtn">开始</button>
        <button class="btn ghost" id="skipBtn" title="跳过 (N)">跳过</button>
      </div>

      <p class="stats" id="statsLine"></p>

      <section class="pets">
        <div class="pet-list" id="petList"></div>
        <button class="btn ghost small" id="addPetBtn">+ 做一个新形象</button>
      </section>

      <p class="tip">空格开始/暂停 · R 重置 · N 跳过 · 点一下伙伴可以摸摸头</p>
    </main>
  </div>

  <dialog id="studioDialog" class="dialog wide"></dialog>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="settings">
      <header class="studio-head">
        <h2>设置</h2>
        <button class="icon-btn" value="cancel" aria-label="关闭">✕</button>
      </header>
      <div class="settings-body">
        <label>专注时长（分钟）<input type="number" min="1" max="180" data-s="focus"></label>
        <label>小憩时长（分钟）<input type="number" min="1" max="60" data-s="short"></label>
        <label>长休时长（分钟）<input type="number" min="1" max="90" data-s="long"></label>
        <label>几个番茄后长休<input type="number" min="2" max="12" data-s="longEvery"></label>
        <label class="check"><input type="checkbox" data-s="autoStart"> 自动进入下一阶段</label>
        <label class="check"><input type="checkbox" data-s="sound"> 提示音</label>
        <label class="check"><input type="checkbox" data-s="notify"> 桌面通知</label>
      </div>
      <div class="settings-actions">
        <button type="button" class="btn ghost small" id="clearStatsBtn">清空统计数据</button>
        <button class="btn primary" value="ok">完成</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
